<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work Consistency</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15803d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Consistency">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%2315803d'/%3E%3Cpath d='M11 21l6 6 12-14' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--sf:#fff;--ln:#dde2ec;--tx:#141a26;--mu:#667086;--ac:#15803d;--on:#fff;--ok:#1f9d6b;--wm:#d98a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--sf:#171c26;--ln:#262d3b;--tx:#e8ebf1;--mu:#8b94a7;--ac:#3ddc97;--on:#052e1c;--ok:#3ddc97;--wm:#ffb84d}}
:root[data-theme="dark"]{--bg:#0e1117;--sf:#171c26;--ln:#262d3b;--tx:#e8ebf1;--mu:#8b94a7;--ac:#3ddc97;--on:#052e1c;--ok:#3ddc97;--wm:#ffb84d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Sora',system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(110px + env(safe-area-inset-bottom,0px))}
h1{font-size:1.4rem;margin:0 0 4px}
h2{font-size:1rem;margin:0 0 12px}
p{margin:0}
.mu{color:var(--mu);font-size:.85rem}
.card{background:color-mix(in srgb,var(--sf) 78%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-top:14px}
select,input{width:100%;padding:11px 12px;margin:6px 0 12px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;font:inherit}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.btn{background:var(--ac);color:var(--on);border:0;padding:11px 16px;border-radius:10px;font-weight:600;width:100%}
.sm{background:none;border:1px solid var(--ln);color:var(--mu);padding:6px 10px;border-radius:8px;font-size:.8rem}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs{display:flex;gap:6px;margin:16px 0 0}
.tabs button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--mu);font-weight:600;font-size:.85rem}
.tabs button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:color-mix(in srgb,var(--sf) 78%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--ln);border-radius:14px;padding:10px}
.stat b{display:block;font-size:1.2rem}
.stat .mu{font-size:.7rem}
.task{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.task .bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--mu);flex:none;display:grid;place-items:center;font-size:.8rem;color:transparent}
.task.done{border-color:var(--ok)}
.task.done .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.row{display:flex;gap:8px;align-items:center}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.bar{height:6px;border-radius:4px;background:var(--ln);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac);animation:grow .7s ease-out}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;min-height:160px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:.8rem}
.col i{display:block;width:100%;background:var(--ac);border-radius:8px;transform-origin:bottom;animation:up .6s ease-out}
.mo{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.mo .mu{font-size:.7rem}
.d{aspect-ratio:1;border-radius:8px;border:1px solid var(--ln);display:grid;place-items:center;font-size:.8rem;background:color-mix(in srgb,var(--ok) calc(var(--p)*1%),var(--bg))}
.d.td{outline:2px solid var(--ac)}
.ch text{fill:var(--mu);font-size:10px;font-family:inherit}
.ch .g{stroke:var(--ln);stroke-width:1}
.ch .b{fill:var(--ac);transform-box:fill-box;transform-origin:bottom;animation:up .6s ease-out}
.ch .l{stroke:var(--ac);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch .a{fill:var(--ac);opacity:.18}
.ch .pt{fill:var(--ac);stroke:var(--sf);stroke-width:1.5}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b2{text-align:center;padding:10px 4px;border:1px solid var(--ln);border-radius:12px;opacity:.4;filter:grayscale(1)}
.b2.on{opacity:1;filter:none;border-color:var(--ok)}
.b2 span{font-size:1.6rem;display:block}
.b2 small{font-size:.7rem;color:var(--mu)}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--ln);flex-wrap:wrap}
.tg{font-size:.75rem;padding:3px 8px;border-radius:8px;border:1px solid var(--ln);color:var(--mu)}
.tg.joined{color:var(--ok);border-color:var(--ok)}
.tg.missed{color:#e5484d;border-color:#e5484d}
.md{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .2s ease-out}
.mb{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:20px;max-width:360px;width:100%;animation:rise .25s ease-out}
.mb p{margin-bottom:16px;font-weight:600}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.38;animation:drift 24s ease-in-out infinite alternate}
.bg i:nth-child(1){background:#16a34a;top:-22vmax;left:-22vmax;--x:12vmax;--y:10vmax}
.bg i:nth-child(2){background:linear-gradient(135deg,#ff2bd6,#8b5cf6);top:-22vmax;right:-22vmax;--x:-12vmax;--y:10vmax;animation-duration:28s}
.bg i:nth-child(3){background:linear-gradient(135deg,#ff2bd6,#8b5cf6);bottom:-22vmax;left:-22vmax;--x:12vmax;--y:-10vmax;animation-duration:26s}
.bg i:nth-child(4){background:#16a34a;bottom:-22vmax;right:-22vmax;--x:-12vmax;--y:-10vmax;animation-duration:30s}

.task,.btn,.sm,.tabs button{transition:transform .15s ease,background .2s ease,border-color .2s ease}
.task:active,.btn:active,.sm:active,.tabs button:active{transform:scale(.95)}
@keyframes drift{to{transform:translate(var(--x),var(--y)) scale(1.12)}}
@keyframes grow{from{width:0}}
@keyframes up{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion:reduce){.bg i,.bar i,.col i,.ch .b,.md,.mb{animation:none}.task,.btn,.sm,.tabs button{transition:none}}

.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 20px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#0f6b3a,#1f9d6b 60%,#2bb673);box-shadow:0 12px 32px rgba(31,157,107,.28)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{width:190px;height:190px;right:-50px;top:-70px}
.hero::after{width:120px;height:120px;right:50px;bottom:-70px;background:rgba(255,255,255,.1)}
.hero>*{position:relative;z-index:1}
.hs{margin:0;opacity:.88;font-size:.9rem}
.hn{margin:2px 0 4px;font-size:1.5rem;line-height:1.2;overflow-wrap:anywhere}
.av{flex:none;width:68px;height:68px;border-radius:50%;border:2.5px solid rgba(255,255,255,.75);background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:1.7rem;font-weight:700}
.hero.big{padding:28px 20px;margin-top:14px}
.hero.big .av{width:84px;height:84px;font-size:2.1rem}
.tb{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;display:flex;padding:6px;border-radius:24px;background:color-mix(in srgb,var(--sf) 72%,transparent);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--ln);box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:20}
.tb[hidden]{display:none}
.tb .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:18px;background:color-mix(in srgb,var(--ac) 22%,transparent);transition:transform .45s cubic-bezier(.32,.72,0,1)}
.tb button{flex:1;position:relative;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;transition:color .25s}
.tb button.on{color:var(--ac)}
.tb svg{transition:transform .25s cubic-bezier(.32,.72,0,1)}
.tb button:active svg{transform:scale(.85)}
.tb small{font-size:.68rem;font-weight:600}
.vin{animation:vin .4s cubic-bezier(.32,.72,0,1)}
@keyframes vin{from{opacity:0;transform:translateY(12px)}}
.card,.stat{border-radius:18px}
@media (prefers-reduced-motion:reduce){.vin{animation:none}.tb .ind,.tb button,.tb svg{transition:none}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i><i></i></div>
<main id="app"></main>
<nav id="tb" class="tb" aria-label="Main navigation" hidden><span class="ind"></span><button data-v="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><small>Today</small></button><button data-v="week"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><small>Week</small></button><button data-v="month"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><small>Month</small></button><button data-v="all"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><small>All</small></button><button data-v="profile"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><small>Profile</small></button></nav>
<script>
(function(){
var KEY='consistency-v2',GR=5,tab='today',wo=0,mo=0,S=null,app=document.getElementById('app'),DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var ACC={users:{},cur:null};function load(){try{var r=localStorage.getItem(KEY);if(r){var a=JSON.parse(r);if(a&&a.users)ACC=a}}catch(e){}return ACC.cur&&ACC.users[ACC.cur]?ACC.users[ACC.cur]:null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ACC))}catch(e){}}
var pad=n=>n<10?'0'+n:''+n,fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
var esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
S=load();if(S){S.tasks=S.tasks||[];S.slots=S.slots||[]}
var t0=()=>{var t=new Date();t.setHours(0,0,0,0);return t},tk=()=>fmt(new Date());
var occ=(s,k)=>k===s.d||(s.rep&&k>s.d),st0=(s,k)=>new Date(k+'T'+s.tm+':00').getTime();
function dayStat(d){var k=fmt(d),r={j:0,p:0,m:0};if(d>t0())return r;

S.slots.forEach(s=>{if(!occ(s,k))return;var v=(s.st||{})[k];if(v==='joined'){r.j++;r.p++}else if(v==='missed'){r.p++;r.m++}});return r}
function range(a,b){var r={j:0,p:0,m:0,perfect:0};for(var d=new Date(a);d<=b;d.setDate(d.getDate()+1)){var x=dayStat(d);r.j+=x.j;r.p+=x.p;r.m+=x.m;if(x.p&&x.j===x.p)r.perfect++}return r}
var pc=r=>r.p?Math.round(r.j/r.p*100):0;
function weekStart(o){var t=t0();t.setDate(t.getDate()-((t.getDay()+6)%7)+o*7);return t}
function streak(){var d=t0(),x=dayStat(d);if(!(x.p&&x.j===x.p))d.setDate(d.getDate()-1);var n=0;for(var i=0;i<400;i++){x=dayStat(d);if(x.p&&x.j===x.p){n++;d.setDate(d.getDate()-1)}else break}return n}
var LOGO='<div class="row" style="margin-bottom:14px"><svg width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="Work Consistency logo"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ac)"/><stop offset="1" stop-color="#1f9d6b"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#lg)"/><path d="M11 21l6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b style="font-size:1.05rem">Work Consistency</b><div class="mu">by Ved</div></div></div>';
var TK='consistency-theme';
function gt(){try{return localStorage.getItem(TK)||'system'}catch(e){return 'system'}}
function ap(){var v=gt(),r=document.documentElement;if(v==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',v)}
function setTheme(v){try{localStorage.setItem(TK,v)}catch(e){}ap()}
ap();
function menu(){var o=document.getElementById('md');if(o)o.remove();var m=document.createElement('div');m.id='md';m.className='md';var th=gt();
m.innerHTML='<div class="mb"><h2>Settings</h2><p class="mu" style="font-weight:400;margin-bottom:12px">'+esc(S.p.name)+(S.p.user?', @'+esc(S.p.user):'')+'</p><p class="mu" style="font-weight:400;margin-bottom:8px">Theme</p><div class="row" style="margin-bottom:16px">'+[['system','System'],['light','Light'],['dark','Dark']].map(x=>'<button class="sm" data-th="'+x[0]+'" style="flex:1;'+(th===x[0]?'border-color:var(--ac);color:var(--ac)':'')+'">'+x[1]+'</button>').join('')+'</div><button class="sm" data-lo="1" style="width:100%;color:#e5484d;border-color:#e5484d;margin-bottom:8px">Log out</button><button class="btn" data-cl="1">Close</button></div>';
m.onclick=e=>{var b=e.target.closest('button');if(!b){if(e.target===m)m.remove();return}
if(b.dataset.th){setTheme(b.dataset.th);m.remove();menu()}
else if(b.dataset.lo){m.remove();modal('Log out? Your data stays saved. Log in again with your username and PIN.',[{l:'Log out',p:1,f:()=>{ACC.cur=null;save();S=null;hv=true;render()}},{l:'Cancel'}])}
else m.remove()};
document.body.appendChild(m)}
function setupOld(){
app.innerHTML=LOGO+'<h1>Let’s set up your tracker</h1><p class="mu">Your data stays in this browser.</p><div class="card"><label class="mu">Full name (first and last name)</label><input id="n" autocomplete="name" placeholder="e.g. Vedant Wavaliye"><label class="mu">Username</label><input id="u" autocomplete="username" autocapitalize="off" placeholder="e.g. Vedant@2026"><p class="mu" style="margin:-6px 0 12px">6 to 20 characters. Use at least 1 capital letter, 1 small letter, 1 number and 1 special character (! @ # $ % & * _ . -). No spaces.</p><label class="mu">I am a</label><select id="g"><option>Student</option><option>Working professional</option><option>Freelancer</option><option>Other</option></select><button class="btn" data-a="go">Start tracking</button></div>'}
function uerr(u){if(u.length<6||u.length>20)return 'Username must be 6 to 20 characters.';if(/\s/.test(u))return 'Username can’t have spaces.';if(/[^A-Za-z0-9!@#$%&*_.\-]/.test(u))return 'Use only letters, numbers and these special characters: ! @ # $ % & * _ . -';if(!/[A-Z]/.test(u))return 'Add at least 1 capital letter.';if(!/[a-z]/.test(u))return 'Add at least 1 small letter.';if(!/[0-9]/.test(u))return 'Add at least 1 number.';if(!/[!@#$%&*_.\-]/.test(u))return 'Add at least 1 special character (! @ # $ % & * _ . -).';return ''}
function goOld(){var n=document.getElementById('n').value.trim(),g=document.getElementById('g').value,u=document.getElementById('u').value.trim();
if(n.split(/\s+/).length<2){modal('Enter your full name (first and last name).',[{l:'OK',p:1}]);return false}
var ue=uerr(u);if(ue){modal(ue,[{l:'OK',p:1}]);return false}S={p:{name:n,user:u,role:g},tasks:[],slots:[]};save();return true}
function todayView(){var k=tk(),l=S.tasks.filter(x=>x.d===k),dn=l.filter(x=>x.done).length;
var h='<div class="card"><h2>Today’s to-do list</h2><div class="row"><input id="nt2" placeholder="Add a task" autocomplete="off" style="margin:0"><button class="sm" data-a="at">Add task</button></div><div style="margin-top:12px">';
if(!l.length)h+='<p class="mu">No tasks for today. Add your first one above.</p>';
l.forEach(x=>{h+='<div class="row" style="margin-bottom:8px"><button class="task'+(x.done?' done':'')+'" data-a="tk" data-v="'+x.id+'" style="flex:1"><span class="bx">✓</span>'+esc(x.t)+'</button><button class="sm" data-a="dk" data-v="'+x.id+'">Delete</button></div>'});
h+='</div>'+(l.length?'<p class="mu">'+dn+' of '+l.length+' done</p><div class="bar"><i style="width:'+Math.round(dn/l.length*100)+'%"></i></div>':'')+'</div>';return h}
function weekView(){var ws=weekStart(wo),we=new Date(ws);we.setDate(ws.getDate()+6);var r=range(ws,we),f={day:'numeric',month:'short'};
var h='<div class="card"><div class="nav"><button class="sm" data-a="wp">Previous</button><b>'+ws.toLocaleDateString('en-IN',f)+' – '+we.toLocaleDateString('en-IN',f)+'</b><button class="sm" data-a="wn"'+(wo>=0?' disabled':'')+'>Next</button></div>'+chartW(ws)+'<div class="wk" style="display:none">';
for(var i=0;i<7;i++){var d=new Date(ws);d.setDate(ws.getDate()+i);var x=dayStat(d),p=pc(x);
h+='<div class="col"><span class="mu">'+(x.p?p+'%':'–')+'</span><i style="height:'+Math.max(4,p)+'px"></i><b>'+DN[i]+'</b><span class="mu">'+d.getDate()+'</span></div>'}
return h+'</div></div><div class="card"><h2>Week report</h2>'+rep(ws,r)+'</div><div class="card"><h2>Week summary</h2><p>'+r.j+' of '+r.p+' done ('+pc(r)+'%)</p><div class="bar"><i style="width:'+pc(r)+'%"></i></div><p class="mu" style="margin-top:10px">Perfect days: '+r.perfect+(r.m?', missed slots: '+r.m:'')+'</p></div>'}
function monthView(){var b=t0(),f=new Date(b.getFullYear(),b.getMonth()+mo,1),l=new Date(f.getFullYear(),f.getMonth()+1,0),r=range(f,l);
var h='<div class="card"><div class="nav"><button class="sm" data-a="mp">Previous</button><b>'+f.toLocaleDateString('en-IN',{month:'long',year:'numeric'})+'</b><button class="sm" data-a="mn"'+(mo>=0?' disabled':'')+'>Next</button></div>'+chartM(f,l)+'<div class="mo" style="margin-top:14px">';
DN.forEach(n=>{h+='<span class="mu">'+n+'</span>'});
for(var i=0;i<(f.getDay()+6)%7;i++)h+='<span></span>';
for(var n=1;n<=l.getDate();n++){var d=new Date(f.getFullYear(),f.getMonth(),n),x=dayStat(d);
h+='<div class="d'+(fmt(d)===tk()?' td':'')+'" style="--p:'+pc(x)+'" title="'+x.j+' of '+x.p+' done">'+n+'</div>'}
return h+'</div></div><div class="card"><h2>Month summary</h2><p>'+r.j+' of '+r.p+' done ('+pc(r)+'%)</p><div class="bar"><i style="width:'+pc(r)+'%"></i></div><p class="mu" style="margin-top:10px">Perfect days: '+r.perfect+(r.m?', missed slots: '+r.m:'')+'</p></div>'}
function grid(W,L,R,y){var s='';[0,50,100].forEach(v=>{s+='<line class="g" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-4)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'%</text>'});return s}

else if(a==='go'){go2();return}else if(a==='fg'){fg();return}else if(a==='ed'){editSlot(v);return}else if(a==='fs'){if(FT.run){FT.left=Math.max(0,Math.round((FT.end-Date.now())/1000));FT.run=false}else{FT.end=Date.now()+FT.left*1000;FT.run=true}}else if(a==='fr'){FT.run=false;FT.left=FT.dl=dur()}else if(a==='fq'){S.fm=+v;FT.run=false;FT.left=FT.dl=dur();save()}else if(a==='fset'){var n=Math.round(+document.getElementById('fm').value);if(!(n>=1&&n<=180)){ok0('Enter minutes between 1 and 180.');return}S.fm=n;FT.run=false;FT.left=FT.dl=dur();save()}
else if(a==='at')addTask();
else if(a==='tk'){S.tasks.forEach(x=>{if(x.id===v)x.done=!x.done});save()}
else if(a==='dk'){S.tasks=S.tasks.filter(x=>x.id!==v);save()}
else if(a==='wp')wo--;else if(a==='wn')wo++;else if(a==='mp')mo--;else if(a==='mn')mo++;
else if(a==='as'){if(!addSlot())return}
else if(a==='nt'){try{Notification.requestPermission().then(p=>modal(p==='granted'?'Notifications are on.':'Notifications are blocked. In-page popups will still work.',[{l:'OK',p:1}]))}catch(x){modal('This browser can’t show notifications here. In-page popups will still work.',[{l:'OK',p:1}])}return}
else if(a==='j'){var s=S.slots.find(x=>x.id===v);s.st[s.rep?tk():s.d]='joined';save()}
else if(a==='x'){modal('Delete this slot?',[{l:'Delete',p:1,f:()=>{S.slots=S.slots.filter(x=>x.id!==v);save();render()}},{l:'Cancel'}]);return}
else if(a==='rs'){modal('Delete your account and all its data from this browser?',[{l:'Delete',p:1,f:()=>{delete ACC.users[ACC.cur];ACC.cur=null;save();S=null;hv=Object.keys(ACC.users).length>0;render()}},{l:'Cancel'}]);return}
render();if(a==='at'){var i=document.getElementById('nt2');if(i)i.focus();tick()}if(a==='as')tick()};
app.onkeydown=function(e){if(e.key==='Enter'&&e.target.id==='nt2'){addTask();render();document.getElementById('nt2').focus()}};
function modal(msg,btns){var o=document.getElementById('md');if(o)o.remove();var m=document.createElement('div');m.id='md';m.className='md';m.innerHTML='<div class="mb"><p>'+msg+'</p><div class="row"></div></div>';var r=m.querySelector('.row');btns.forEach(b=>{var e=document.createElement('button');e.className=b.p?'btn':'sm';e.textContent=b.l;e.onclick=()=>{m.remove();if(b.f)b.f()};r.appendChild(e)});document.body.appendChild(m);try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
function notify(t){beep();try{if(window.Notification&&Notification.permission==='granted')new Notification('Work Consistency',{body:t})}catch(e){}}
function tick(){if(!S)return;var now=Date.now(),k0=tk(),ch=false;if(window._dk&&window._dk!==k0)ch=true;window._dk=k0;
S.slots.forEach(s=>{s.st=s.st||{};s.fr=s.fr||{};var last=t0(),n=0;
for(var d=new Date(s.d+'T00:00:00');d<=last&&n<90;d.setDate(d.getDate()+1),n++){var k=fmt(d);if(!occ(s,k)||s.st[k])continue;if(now>st0(s,k)+GR*60000){s.st[k]='missed';ch=true}}
if(!occ(s,k0)||s.st[k0])return;
var mins=(st0(s,k0)-now)/60000,key=mins<=0?'0':mins<=5?'5':mins<=10?'10':null;
if(!key||s.fr[k0+key])return;
s.fr[k0+key]=1;if(key!=='10')s.fr[k0+'10']=1;if(key==='0')s.fr[k0+'5']=1;ch=true;
if(key==='0'){notify(s.t+' is starting now. Get ready!');modal(esc(s.t)+' slot is starting now. Get ready! Tap Join to mark it.',[{l:'Join now',p:1,f:()=>{s.st[k0]='joined';save();render()}},{l:'Later'}])}
else{notify(s.t+' starts in '+key+' minutes');modal(esc(s.t)+' starts in '+key+' minutes. Get ready for your slot!',[{l:'OK',p:1}])}});
if(ch){save();render()}}
setInterval(tick,15000);setTimeout(tick,600);
render();
})();
</script>
